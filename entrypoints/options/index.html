<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">Blocklist</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1 data-i18n="extName">Pare-Facho</h1>
      <p class="muted" data-i18n="intro"></p>

      <section id="status">
        <h2 data-i18n="statusTitle"></h2>
        <div class="stats">
          <div class="stat"><strong id="stat-listed">–</strong><span data-i18n="statListed"></span></div>
          <div class="stat"><strong id="stat-blocked">–</strong><span data-i18n="statBlocked"></span></div>
          <div class="stat"><strong id="stat-remaining">–</strong><span data-i18n="statRemaining"></span></div>
          <div class="stat"><strong id="stat-today">–</strong><span data-i18n="statToday"></span></div>
          <div class="stat"><strong id="stat-next">–</strong><span data-i18n="statNext"></span></div>
        </div>
        <p id="state-line" class="muted"></p>
        <p id="tab-notice" class="notice" data-i18n="tabNotice"></p>
        <p id="no-tab" class="warn" data-i18n="noTab" hidden></p>
      </section>

      <section>
        <h2 data-i18n="listsTitle"></h2>
        <div id="subscriptions"></div>
        <form id="subscribe-form">
          <input id="subscribe-url" type="url" data-i18n-placeholder="subscribePlaceholder" required />
          <button type="submit" data-i18n="subscribeButton"></button>
          <span id="subscribe-status" class="status"></span>
        </form>
        <p class="muted"><span id="refresh-every"></span> <button type="button" id="refresh-now" data-i18n="refreshNow"></button></p>
      </section>

      <section>
        <h2 data-i18n="ownTitle"></h2>
        <p class="muted" data-i18n="ownHelp"></p>
        <form id="own-add-form">
          <input id="own-add" type="text" data-i18n-placeholder="ownAddPlaceholder" required />
          <button type="submit" data-i18n="ownAddButton"></button>
          <span id="own-add-status" class="status"></span>
        </form>
        <textarea id="manual" rows="6" spellcheck="false"></textarea>
        <div><button type="button" id="manual-save" data-i18n="save"></button> <span id="manual-status" class="status"></span></div>
      </section>

      <section>
        <h2 data-i18n="allowTitle"></h2>
        <p class="muted" data-i18n="allowHelp"></p>
        <textarea id="allow" rows="3" spellcheck="false"></textarea>
        <div><button type="button" id="allow-save" data-i18n="save"></button> <span id="allow-status" class="status"></span></div>
      </section>

      <section>
        <h2 data-i18n="allTitle"></h2>
        <p class="muted" data-i18n="allHelp"></p>
        <div class="toolbar">
          <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" />
          <span id="all-count" class="muted"></span>
        </div>
        <table id="all-table">
          <thead><tr><th data-i18n="colAccount"></th><th data-i18n="colName"></th><th data-i18n="colList"></th><th data-i18n="colStatus"></th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2 data-i18n="blockingTitle"></h2>
        <p data-i18n="blockingHelp"></p>
        <p class="warn" data-i18n="blockingWarn"></p>
        <label><input type="checkbox" id="blocking-enabled" /> <span data-i18n="blockingEnabled"></span></label><br />
        <label><input type="checkbox" id="paused" /> <span data-i18n="paused"></span></label>
        <div class="grid">
          <label><span data-i18n="perHour"></span> <input type="number" id="per-hour" min="1" max="1000" /></label>
          <label><span data-i18n="perDay"></span> <input type="number" id="per-day" min="1" max="5000" /></label>
          <label><span data-i18n="gapMin"></span> <input type="number" id="gap-min" min="0" max="3600" /></label>
          <label><span data-i18n="gapMax"></span> <input type="number" id="gap-max" min="0" max="3600" /></label>
        </div>
        <div><button type="button" id="settings-save" data-i18n="save"></button> <span id="settings-status" class="status"></span></div>
      </section>

      <section>
        <h2 data-i18n="historyTitle"></h2>
        <p class="muted" data-i18n="historyHelp"></p>
        <p id="history-summary"></p>
        <p><button type="button" id="retry-failed" data-i18n="retryFailed"></button> <button type="button" id="clear-history" data-i18n="clearHistory"></button></p>
        <table id="history-table">
          <thead><tr><th data-i18n="colAccount"></th><th data-i18n="colStatus"></th><th data-i18n="colWhen"></th><th data-i18n="colNote"></th></tr></thead>
          <tbody></tbody>
        </table>
        <p id="history-empty" class="muted" data-i18n="historyEmpty" hidden></p>
      </section>

      <section>
        <h2 data-i18n="activityTitle"></h2>
        <pre id="log"></pre>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
